name: Build, test and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimtogether-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify whole cohort
        shell: pwsh
        run: ./BUILD.ps1 -Version "1.1.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: .build/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish verified update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_VERSION: v1.1.${{ github.run_number }}
        run: |
          gh release create "$RELEASE_VERSION" release-assets/* --target "$SOURCE_SHA" --title "RimTogether $RELEASE_VERSION" --notes "Verified launcher, server and Multiplayer cohort. Download RimTogether.Start.exe once; future updates are automatic. Personal settings and saves stay on your PC." --latest
